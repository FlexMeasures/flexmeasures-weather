[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flexmeasures-weather"
description = "Integrating FlexMeasures with multiple API services"
readme = "README.md"
requires-python = ">=3.10, <3.13"  # FlexMeasures 1.0 supports these versions
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Seita Energy Flexibility BV", email = "nicolas@seita.nl"}
]
keywords = ["flexmeasures", "energy flexibility"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
    # FlexMeasures itself is deliberately not listed here: this is a plugin, installed
    # into an existing FlexMeasures environment that provides it. Pinning it as a runtime
    # dependency would let pip/uv pull a second, conflicting FlexMeasures into that
    # environment. It is a test/dev dependency instead (see [dependency-groups]).
    # pvlib declares h5py itself, for clear-sky Linke turbidity lookups.
    "pvlib>=0.15.2",
]

[project.urls]
"Source code" = "https://github.com/FlexMeasures/flexmeasures-weather"

[dependency-groups]
test = [
    # The host application for this plugin. Not a runtime dependency (see [project]),
    # but the test suite imports it and runs against its app factory and fixtures.
    "flexmeasures>=1.0,<2",
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "pytest-sugar>=1.1.1",
    "pytest-cov>=7.1.0",
    # lets tests run successfully in containers
    "fakeredis>=2.37.1",
    # required with fakeredis, maybe because we use rq
    "lupa>=2.8",
]

dev = [
    "black>=26.5.1",
    "flake8==7.1.1",
    "flake8-blind-except>=0.2.1",
    "pytest-runner>=6.0.1",
    "watchdog>=6.0.0",
    "poethepoet>=0.41.0",
    # pre-commit runs the hooks in CI, so keep it locked rather than resolved at run time.
    "pre-commit>=4.6",
    # Type checking
    "mypy>=2.3.1",
    "types-pytz>=2026.3.1.20260727",
    "types-requests>=2.33.0.20260906",
    "types-flask>=1.1.6",
    "types-click>=7.1.8",
    "types-redis>=4.6.0.20241004",
    "types-tzlocal>=5.1.0.1",
    "types-python-dateutil>=2.9.0.20260807",
    "types-setuptools>=84.0.0.20260812",
]

[tool.poe.tasks.test]
help = "Run the test suite. Needs a test database (see test-db-start)."
cmd = "pytest"
# FlexMeasures defaults to localhost:5432/flexmeasures_test, often a *development* database
# locally -- and our fixtures create and drop schema. Point at test-db-start's throwaway DB
# instead; override to use your own.
env = { SQLALCHEMY_TEST_DATABASE_URI.default = "postgresql://flexmeasures_test:flexmeasures_test@127.0.0.1:5544/flexmeasures_test" }

[tool.poe.tasks.test-db-start]
help = "Start a throwaway PostgreSQL for the test suite on port 5544, with the cube & earthdistance extensions loaded."
shell = """
    docker run -d --name flexmeasures-weather-test-db \
        -e POSTGRES_USER=flexmeasures_test \
        -e POSTGRES_PASSWORD=flexmeasures_test \
        -e POSTGRES_DB=flexmeasures_test \
        -p 127.0.0.1:5544:5432 postgres:17.4
    printf "Waiting for PostgreSQL to accept connections ...\n"
    # pg_isready alone is not enough: it already succeeds against the temporary server
    # the postgres image runs during initdb, which then shuts down again. Poll a real query.
    until docker exec flexmeasures-weather-test-db psql -q -U flexmeasures_test -d flexmeasures_test -c "select 1" > /dev/null 2>&1; do sleep 1; done
    docker exec -i flexmeasures-weather-test-db psql -q -U flexmeasures_test -d flexmeasures_test < scripts/load-psql-extensions.sql
    printf "Test database ready on 127.0.0.1:5544.\n"
"""

[tool.poe.tasks.test-db-stop]
help = "Remove the throwaway test PostgreSQL started by test-db-start."
cmd = "docker rm --force --volumes flexmeasures-weather-test-db"

[tool.poe.tasks.type-check]
help = "Run mypy type checking on the plugin's Python files."
shell = """
    files=$(find flexmeasures_weather -name \\*.py)
    mypy --follow-imports skip --ignore-missing-imports $files
"""

[tool.hatch.build.targets.wheel]
packages = ["flexmeasures_weather"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = "--strict-markers"

# Restrict uv's dependency resolution to the three real target platforms.
# Without this, uv generates fork markers for impossible platform combinations
# (e.g. os_name == 'nt' AND sys_platform == 'darwin'), which causes
# `uv sync --locked` to fail because the fork markers don't fully cover the
# declared environment space.
[tool.uv]
# Contributors and CI should write uv.lock with the same uv version.
# Otherwise, environment markers get reformatted, and a small dependency change comes out as a huge diff.
# This gates every uv invocation, so bumping it means bumping the pins in our workflows, too.
required-version = "==0.12.7"
# `uv sync` should give a complete dev environment, like `make install-for-dev` used to.
default-groups = ["dev", "test"]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
